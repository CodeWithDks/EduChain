name: Python Code Quality & Testing (CI)

# Triggers the workflow on push or pull requests to your main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-project:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the repository code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Set up the Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Automatically caches dependencies to speed up future runs

      # 3. Install your project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Run your exact test file
      - name: Run automated tests
        run: |
          python test_all_features.py
